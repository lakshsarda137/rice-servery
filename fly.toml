# fly.toml app configuration file generated for rice-servery on 2024-11-30T22:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "rice-servery"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/"

[processes]
  app = "uvicorn servery_finder_web:app --host 0.0.0.0 --port ${PORT:-8080}"

