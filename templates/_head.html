    <script>
        // Theme: saved choice wins, otherwise follow the phone. Runs before paint so there's no flash.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('darkMode'); } catch (e) {}
            var dark = saved === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : saved === 'true';
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();

        function toggleDarkMode() {
            var dark = document.documentElement.dataset.theme !== 'dark';
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            try { localStorage.setItem('darkMode', dark); } catch (e) {}
        }
    </script>
