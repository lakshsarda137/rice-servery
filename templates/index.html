<!DOCTYPE html>
<html lang="en">
<head>
{% include "_head.html" %}
    <title>OwlUCanEat</title>
    <style>
        .intro { padding: 10px 0 22px; }

        .open-status {
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px 0 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .open-status .chevron {
            width: 14px;
            height: 14px;
            color: var(--muted);
            transition: transform 0.2s ease;
        }

        .open-status[aria-expanded="true"] .chevron { transform: rotate(180deg); }
        .open-status .sep { color: var(--border-strong); }

        .open-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .open-list[hidden] { display: none; }

        .open-list-item {
            font-size: 0.8rem;
            color: var(--text-2);
            background: var(--surface-2);
            border-radius: 8px;
            padding: 5px 10px;
        }

        .open-list-item b { font-weight: 600; color: var(--text); }

        /* Filters */
        .filters { padding: 2px 16px; }

        .field { padding: 18px 0; border-bottom: 1px solid var(--border); }
        .field:last-child { border-bottom: 0; }

        .field-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .field-head .section-label { margin: 0; }
        .field-sub { margin-top: 18px; }

        .select-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .select-wrap { position: relative; }

        .select-wrap::after {
            content: '';
            position: absolute;
            right: 15px;
            top: 50%;
            width: 7px;
            height: 7px;
            border-right: 1.5px solid var(--muted);
            border-bottom: 1.5px solid var(--muted);
            transform: translateY(-70%) rotate(45deg);
            pointer-events: none;
        }

        .filter-input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            font-size: 16px; /* 16px stops iOS zooming in on focus */
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text);
            -webkit-appearance: none;
            appearance: none;
        }

        select.filter-input { padding-right: 36px; }
        .filter-input::placeholder { color: var(--muted); }

        .filter-input:focus {
            outline: none;
            border-color: var(--text-2);
            background: var(--surface);
        }

        .pill-grid { display: flex; flex-wrap: wrap; gap: 8px; }

        .cuisine-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            display: inline-block;
            flex-shrink: 0;
        }

        /* "Leave out" picks are struck through, so they read without relying on red */
        .dietary-icons-exclude .icon-option.selected {
            background: var(--danger-soft);
            border-color: var(--danger);
            color: var(--danger);
            text-decoration: line-through;
        }

        /* Dietary badges (filter pills and dish rows) */
        .tag {
            display: inline-flex;
            align-items: center;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1;
            padding: 3px 5px;
            border-radius: 5px;
            border: 1px solid currentColor;
            text-decoration: none;
        }

        .tag-vegan { color: var(--tag-vegan); }
        .tag-vegetarian { color: var(--tag-vegetarian); }
        .tag-halal { color: var(--tag-halal); }
        .pill.selected .tag { color: inherit; }

        /* Actions */
        .actions { margin-top: 16px; }

        .search-btn {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 14px;
            background: var(--text);
            color: var(--bg);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            transition: opacity 0.15s ease;
        }

        .search-btn:active { opacity: 0.85; }
        .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .quiet-actions {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 6px;
        }

        .refresh-btn,
        .export-btn {
            min-height: 40px;
            padding: 0 12px;
            border: 0;
            background: none;
            color: var(--text-2);
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
        }

        .refresh-btn:disabled,
        .export-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .refresh-icon { width: 15px; height: 15px; }
        .refreshing .refresh-icon { animation: refresh-spin 0.9s linear infinite; }

        @keyframes refresh-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .refresh-status {
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            min-height: 1.2em;
            margin-top: 2px;
        }

        .refresh-status.error { color: var(--danger); }

        /* Results */
        .results { margin-top: 28px; }

        .no-results {
            text-align: center;
            padding: 40px 16px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .results-summary {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 56px 16px;
        }

        .loading-dots { display: flex; gap: 8px; }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        .loading-text { color: var(--muted); font-size: 0.9rem; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .item-group { margin-bottom: 18px; }
        .past-meal-group { opacity: 0.55; }

        .item-group-title {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 2px 10px;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-2);
        }

        .past-meal-badge {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--muted);
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            padding: 2px 8px;
        }

        .menu-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px 6px;
            margin-bottom: 10px;
        }

        .servery-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.02rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .open-pill {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--open);
        }

        .menu-items-list { list-style: none; }

        .menu-items-list-item {
            padding: 10px 0;
            border-top: 1px solid var(--border);
        }

        .menu-items-list-item:first-child { border-top: 0; }

        .dish-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 8px;
        }

        .dish-name { font-size: 0.95rem; color: var(--text); }
        .dish-tags { display: inline-flex; gap: 4px; }

        .dish-allergens {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 2px;
        }

        @media (min-width: 720px) {
            .filters { padding: 2px 24px; }
            .intro { padding: 24px 0 28px; }
        }
    </style>
</head>
<body>
{% include "_header.html" %}

    <main class="page">
        <section class="intro">
            <h1 class="page-title">This week's menus</h1>
            <p class="page-subtitle">Search all serveries by dish, cuisine or diet.</p>
            <button class="open-status" id="open-status" type="button" aria-expanded="false" aria-controls="open-list" onclick="toggleOpenList()">
                <span id="open-status-text">Loading…</span>
                <span class="sep">·</span>
                <span id="current-time-badge"></span>
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="open-list" id="open-list" hidden></div>
        </section>

        <section class="card filters" aria-label="Filters">
            <div class="field">
                <div class="field-head"><span class="section-label">When</span></div>
                <div class="select-row">
                    <div class="select-wrap">
                        <select id="day" class="filter-input" aria-label="Day">
                            <option value="">Any day</option>
                            <option value="monday">Monday</option>
                            <option value="tuesday">Tuesday</option>
                            <option value="wednesday">Wednesday</option>
                            <option value="thursday">Thursday</option>
                            <option value="friday">Friday</option>
                            <option value="saturday">Saturday</option>
                            <option value="sunday">Sunday</option>
                        </select>
                    </div>
                    <div class="select-wrap">
                        <select id="meal" class="filter-input" aria-label="Meal">
                            <option value="">Any meal</option>
                            <option value="lunch">Lunch</option>
                            <option value="munch">Munch</option>
                            <option value="dinner">Dinner</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="field">
                <div class="field-head"><span class="section-label">Servery</span></div>
                <div class="pill-grid">
                    <button type="button" class="pill servery-option servery-option-all selected" data-servery="all">All</button>
                    <button type="button" class="pill servery-option" data-servery="north">North</button>
                    <button type="button" class="pill servery-option" data-servery="south">South</button>
                    <button type="button" class="pill servery-option" data-servery="west">West</button>
                    <button type="button" class="pill servery-option" data-servery="seibel">Seibel</button>
                    <button type="button" class="pill servery-option" data-servery="baker">Baker</button>
                    <button type="button" class="pill servery-option" data-servery="south main">South Main</button>
                </div>
            </div>

            <div class="field">
                <div class="field-head"><span class="section-label">Cuisine</span></div>
                <div class="pill-grid" id="cuisine-options"></div>
            </div>

            <div class="field">
                <div class="field-head"><label class="section-label" for="item">Dish</label></div>
                <input type="text" id="item" class="filter-input" placeholder="Paneer, pad thai, biryani…" autocomplete="off" enterkeyhint="search">
            </div>

            <div class="field">
                <div class="field-head">
                    <span class="section-label">Only show</span>
                    <div class="segmented" role="group" aria-label="When several are picked, match">
                        <button id="dietary-mode-or" type="button" class="dietary-mode-btn active">Any</button>
                        <button id="dietary-mode-and" type="button" class="dietary-mode-btn">All</button>
                    </div>
                </div>
                <div class="pill-grid dietary-icons-include" id="dietary-icons-include">
                    <button type="button" class="pill icon-option" data-dietary="vegan"><span class="tag tag-vegan">VG</span>Vegan</button>
                    <button type="button" class="pill icon-option" data-dietary="vegetarian"><span class="tag tag-vegetarian">V</span>Vegetarian</button>
                    <button type="button" class="pill icon-option" data-dietary="halal"><span class="tag tag-halal">H</span>Halal</button>
                    <button type="button" class="pill icon-option" data-dietary="gluten">Gluten</button>
                    <button type="button" class="pill icon-option" data-dietary="soy">Soy</button>
                    <button type="button" class="pill icon-option" data-dietary="dairy">Dairy</button>
                    <button type="button" class="pill icon-option" data-dietary="eggs">Eggs</button>
                    <button type="button" class="pill icon-option" data-dietary="fish">Fish</button>
                    <button type="button" class="pill icon-option" data-dietary="shellfish">Shellfish</button>
                    <button type="button" class="pill icon-option" data-dietary="peanuts">Peanuts</button>
                    <button type="button" class="pill icon-option" data-dietary="tree nuts">Tree nuts</button>
                    <button type="button" class="pill icon-option" data-dietary="sesame">Sesame</button>
                </div>

                <div class="field-head field-sub"><span class="section-label">Leave out</span></div>
                <div class="pill-grid dietary-icons-exclude" id="dietary-icons-exclude">
                    <button type="button" class="pill icon-option" data-dietary="gluten">Gluten</button>
                    <button type="button" class="pill icon-option" data-dietary="soy">Soy</button>
                    <button type="button" class="pill icon-option" data-dietary="dairy">Dairy</button>
                    <button type="button" class="pill icon-option" data-dietary="eggs">Eggs</button>
                    <button type="button" class="pill icon-option" data-dietary="fish">Fish</button>
                    <button type="button" class="pill icon-option" data-dietary="shellfish">Shellfish</button>
                    <button type="button" class="pill icon-option" data-dietary="peanuts">Peanuts</button>
                    <button type="button" class="pill icon-option" data-dietary="tree nuts">Tree nuts</button>
                    <button type="button" class="pill icon-option" data-dietary="sesame">Sesame</button>
                    <button type="button" class="pill icon-option" data-dietary="vegan">Vegan</button>
                    <button type="button" class="pill icon-option" data-dietary="vegetarian">Vegetarian</button>
                    <button type="button" class="pill icon-option" data-dietary="halal">Halal</button>
                </div>
            </div>
        </section>

        <div class="actions">
            <button class="search-btn" id="search-btn" type="button" onclick="search()">Search</button>
            <div class="quiet-actions">
                <button class="refresh-btn" id="refresh-btn" type="button" onclick="refreshMenus()" title="Re-download this week's menus from dining.rice.edu">
                    <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                    Refresh menus
                </button>
                <button class="export-btn" id="export-btn" type="button" onclick="exportPdf()" title="Download the menu matching the current filters as a PDF">
                    <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
                    Save as PDF
                </button>
            </div>
            <div class="refresh-status" id="refresh-status" aria-live="polite"></div>
        </div>

        <div class="results" id="results">
            <div class="no-results">Choose filters, then tap Search.</div>
        </div>
    </main>

    <script>
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function titleCase(text) {
            return String(text).replace(/\b\w/g, ch => ch.toUpperCase());
        }

        // "wednesday", "08:04 AM" -> "Wed 8:04 AM"
        function formatClock(day, time) {
            return `${titleCase(day).slice(0, 3)} ${time.replace(/^0/, '')}`;
        }

        // Open-now status line
        async function loadCurrentlyOpen() {
            try {
                const response = await fetch('/api/currently-open');
                const data = await response.json();
                const text = document.getElementById('open-status-text');
                const list = document.getElementById('open-list');

                text.textContent = data.count > 0
                    ? `${data.count} open now`
                    : 'All serveries closed';
                list.innerHTML = data.open_serveries.map(item =>
                    `<span class="open-list-item"><b>${escapeHtml(item.servery)}</b> · ${escapeHtml(item.meal)}</span>`
                ).join('');
            } catch (error) {
                console.error('Failed to load currently open serveries:', error);
            }
        }

        function toggleOpenList() {
            const status = document.getElementById('open-status');
            const list = document.getElementById('open-list');
            if (!list.children.length) return;
            const expanded = status.getAttribute('aria-expanded') !== 'true';
            status.setAttribute('aria-expanded', expanded);
            list.hidden = !expanded;
        }

        loadCurrentlyOpen();
        setInterval(loadCurrentlyOpen, 60000);

        async function loadCurrentTime() {
            try {
                const response = await fetch('/api/current-time');
                const data = await response.json();
                if (data.day && data.time) {
                    document.getElementById('current-time-badge').textContent = formatClock(data.day, data.time);
                }
            } catch (error) {
                console.error('Failed to load current time:', error);
            }
        }

        loadCurrentTime();
        setInterval(loadCurrentTime, 60000);

        let selectedDietariesInclude = []; // Items that MUST contain these
        let selectedDietariesExclude = []; // Items that MUST NOT contain these
        let dietaryMode = 'or'; // 'and' = Match ALL, 'or' = Match ANY (for include only)
        let selectedCuisines = [];
        let selectedServeries = []; // Selected individual serveries (if all are selected, auto-switches to "All")
        let allServeriesSelected = true; // "All" is selected by default
        // Get supported cuisines from backend
        const CUISINE_OPTIONS = {{ supported_cuisines | tojson }};

        const CUISINE_COLOR_MAP = {
            indian: '#f97316',
            mexican: '#0ea5e9',
            italian: '#ef4444',
            chinese: '#8b5cf6',
            japanese: '#22c55e',
            thai: '#eab308',
            mediterranean: '#14b8a6',
            american: '#6b7280',
            asian: '#3b82f6',
            french: '#e11d48',
            korean: '#dc2626',
            vietnamese: '#059669',
            greek: '#3b82f6'
        };

        // Handle dietary mode toggle (Any / All) - only for include mode
        const dietaryModeAndBtn = document.getElementById('dietary-mode-and');
        const dietaryModeOrBtn = document.getElementById('dietary-mode-or');

        dietaryModeAndBtn.addEventListener('click', () => {
            dietaryMode = 'and';
            dietaryModeAndBtn.classList.add('active');
            dietaryModeOrBtn.classList.remove('active');
        });

        dietaryModeOrBtn.addEventListener('click', () => {
            dietaryMode = 'or';
            dietaryModeOrBtn.classList.add('active');
            dietaryModeAndBtn.classList.remove('active');
        });

        // Dietary pills: toggle into the include / exclude lists
        function bindDietaryPills(containerId, getList, setList) {
            document.querySelectorAll(`#${containerId} .icon-option`).forEach(option => {
                option.addEventListener('click', function() {
                    const value = this.dataset.dietary;
                    const selected = this.classList.toggle('selected');
                    setList(selected
                        ? [...getList().filter(d => d !== value), value]
                        : getList().filter(d => d !== value));
                });
            });
        }

        bindDietaryPills('dietary-icons-include', () => selectedDietariesInclude, list => { selectedDietariesInclude = list; });
        bindDietaryPills('dietary-icons-exclude', () => selectedDietariesExclude, list => { selectedDietariesExclude = list; });

        // Cuisine pills
        const cuisineOptions = document.getElementById('cuisine-options');
        cuisineOptions.innerHTML = CUISINE_OPTIONS.map(cuisine => {
            const color = CUISINE_COLOR_MAP[cuisine.toLowerCase()] || '#6b7280';
            return `<button type="button" class="pill" data-cuisine="${escapeHtml(cuisine)}"><span class="cuisine-dot" style="background:${color}"></span>${escapeHtml(cuisine)}</button>`;
        }).join('');

        cuisineOptions.querySelectorAll('.pill').forEach(pill => {
            pill.addEventListener('click', function() {
                const cuisine = this.dataset.cuisine;
                const selected = this.classList.toggle('selected');
                selectedCuisines = selected
                    ? [...selectedCuisines, cuisine]
                    : selectedCuisines.filter(c => c !== cuisine);
            });
        });

        // Allow Enter key to search from item input
        document.getElementById('item').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                this.blur();
                search();
            }
        });

        // Servery selection
        const SERVERY_NAMES = {
            'north': 'North',
            'south': 'South',
            'west': 'West',
            'seibel': 'Seibel',
            'baker': 'Baker',
            'south main': 'South Main'
        };
        const TOTAL_SERVERIES = Object.keys(SERVERY_NAMES).length;

        function selectAllServeries() {
            allServeriesSelected = true;
            selectedServeries = [];
            document.querySelectorAll('.servery-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.servery === 'all');
            });
        }

        document.querySelectorAll('.servery-option').forEach(option => {
            option.addEventListener('click', function() {
                const serveryValue = this.dataset.servery;

                if (serveryValue === 'all') {
                    selectAllServeries();
                    return;
                }

                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    selectedServeries = selectedServeries.filter(s => s !== serveryValue);
                    if (selectedServeries.length === 0) {
                        selectAllServeries();
                    }
                    return;
                }

                allServeriesSelected = false;
                document.querySelector('.servery-option-all').classList.remove('selected');
                this.classList.add('selected');
                selectedServeries.push(serveryValue);

                // Picking every servery is the same as "All"
                if (selectedServeries.length === TOTAL_SERVERIES) {
                    selectAllServeries();
                }
            });
        });

        // Force the backend to re-download every servery's menu from dining.rice.edu.
        // Useful when a menu changed mid-week.
        async function refreshMenus() {
            const btn = document.getElementById('refresh-btn');
            const status = document.getElementById('refresh-status');
            btn.disabled = true;
            btn.classList.add('refreshing');
            status.classList.remove('error');
            status.textContent = 'Updating menus…';

            try {
                const response = await fetch('/api/refresh', { method: 'POST' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                status.textContent = `Menus updated: ${data.total_items} dishes this week`;

                // If results are showing, re-run the search so the page reflects the new data
                const resultsDiv = document.getElementById('results');
                if (resultsDiv && !resultsDiv.querySelector('.no-results') && resultsDiv.textContent.trim()) {
                    await search();
                }
            } catch (error) {
                status.classList.add('error');
                status.textContent = `Refresh failed: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.classList.remove('refreshing');
            }
        }

        // Current filter selections in the shape /api/search and /api/export expect
        function currentFilterPayload() {
            const servery = allServeriesSelected ? '' : selectedServeries.join(',');
            return {
                cuisine: selectedCuisines.join(','),
                dietary: selectedDietariesInclude.join(','),
                dietary_exclude: selectedDietariesExclude.join(','),
                dietary_mode: dietaryMode || "or",
                day: document.getElementById('day').value.trim(),
                meal: document.getElementById('meal').value.trim(),
                item: document.getElementById('item').value.trim(),
                servery: servery
            };
        }

        // Download the menu matching the current filters as a PDF
        async function exportPdf() {
            const btn = document.getElementById('export-btn');
            const status = document.getElementById('refresh-status');
            btn.disabled = true;
            status.classList.remove('error');
            status.textContent = 'Making PDF…';
            try {
                const response = await fetch('/api/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentFilterPayload())
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const disposition = response.headers.get('Content-Disposition') || '';
                const match = disposition.match(/filename="([^"]+)"/);
                const filename = match ? match[1] : 'owlucaneat-menu.pdf';
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 60000);
                status.textContent = `Saved ${filename}`;
            } catch (error) {
                status.classList.add('error');
                status.textContent = `Export failed: ${error.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        async function search() {
            const payload = currentFilterPayload();
            const resultsDiv = document.getElementById('results');

            // Check for contradictory selections (same tag in both "Only show" and "Leave out")
            const contradictions = selectedDietariesInclude.filter(d => selectedDietariesExclude.includes(d));
            if (contradictions.length > 0) {
                const names = contradictions.map(titleCase).join(', ');
                resultsDiv.innerHTML = `<div class="no-results">You picked ${escapeHtml(names)} in both “Only show” and “Leave out”. Remove it from one.</div>`;
                return;
            }

            resultsDiv.innerHTML = `
                <div class="loading-container">
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                    <div class="loading-text">Searching…</div>
                </div>
            `;
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
                    resultsDiv.innerHTML = `<div class="no-results">Error: ${escapeHtml(errorData.error || 'Request failed')}</div>`;
                    return;
                }

                const data = await response.json().catch(error => {
                    throw new Error('Failed to parse response');
                });

                if (data.error) {
                    resultsDiv.innerHTML = `<div class="no-results">${escapeHtml(data.error)}</div>`;
                    return;
                }

                if (data.current_time) {
                    document.getElementById('current-time-badge').textContent = formatClock(data.current_time.day, data.current_time.time);
                }

                displayResults(data);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="no-results">Error: ${escapeHtml(error.message)}</div>`;
            }
        }

        // Global schedule data loaded from backend
        let DINING_SCHEDULE_DATA = null;

        // Load schedule data from backend
        async function loadScheduleData() {
            try {
                const response = await fetch('/api/schedule');
                const data = await response.json();
                DINING_SCHEDULE_DATA = data.schedule;
            } catch (error) {
                console.error('Failed to load schedule data:', error);
            }
        }

        // Load schedule on page load
        loadScheduleData();

        // Helper: Check if servery has munch on a given day
        function serveryHasMunch(serveryName, dayName) {
            if (!DINING_SCHEDULE_DATA) return false;
            const dayMap = {
                'monday': 0, 'tuesday': 1, 'wednesday': 2, 'thursday': 3,
                'friday': 4, 'saturday': 5, 'sunday': 6
            };
            const dayNum = dayMap[dayName.toLowerCase()];
            if (dayNum === undefined) return false;
            const serveryLower = serveryName.toLowerCase();
            const serverySchedule = DINING_SCHEDULE_DATA[serveryLower];
            if (!serverySchedule || !serverySchedule[dayNum]) return false;
            return serverySchedule[dayNum].some(meal => meal.meal_type === 'munch');
        }

        // Helper: Get servery-specific meal time range
        function getServeryMealTimeRange(serveryName, dayName, mealType) {
            if (!DINING_SCHEDULE_DATA) return null;
            const dayMap = {
                'monday': 0, 'tuesday': 1, 'wednesday': 2, 'thursday': 3,
                'friday': 4, 'saturday': 5, 'sunday': 6
            };
            const dayNum = dayMap[dayName.toLowerCase()];
            if (dayNum === undefined) return null;
            const serveryLower = serveryName.toLowerCase();
            const serverySchedule = DINING_SCHEDULE_DATA[serveryLower];
            if (!serverySchedule || !serverySchedule[dayNum]) return null;

            // Find the meal in the schedule
            const meal = serverySchedule[dayNum].find(m => {
                // Normalize meal types (late_night -> dinner, extended_dinner -> dinner)
                const normalizedMeal = m.meal_type === 'late_night' || m.meal_type === 'extended_dinner' ? 'dinner' : m.meal_type;
                return normalizedMeal === mealType.toLowerCase();
            });

            if (!meal) return null;

            // Parse time string "HH:MM" to minutes since midnight
            const [startHour, startMin] = meal.start_time.split(':').map(Number);
            const [endHour, endMin] = meal.end_time.split(':').map(Number);

            return {
                start: startHour * 60 + startMin,
                end: endHour * 60 + endMin
            };
        }

        // Positive dietary tags get a badge on the dish; everything else is an allergen line
        const DIET_BADGES = { Vegan: ['VG', 'tag-vegan'], Vegetarian: ['V', 'tag-vegetarian'], Halal: ['H', 'tag-halal'] };

        function renderDish(item) {
            const icons = item.icons || [];
            const dots = (item.matchedCuisines || []).map(c => {
                const color = CUISINE_COLOR_MAP[String(c).toLowerCase()] || '#6b7280';
                return `<span class="cuisine-dot" style="background:${color}" title="${escapeHtml(c)}"></span>`;
            }).join('');
            // Vegan implies vegetarian, so show only the stronger badge
            const badges = icons
                .filter(icon => DIET_BADGES[icon] && !(icon === 'Vegetarian' && icons.includes('Vegan')))
                .map(icon => `<span class="tag ${DIET_BADGES[icon][1]}" title="${icon}">${DIET_BADGES[icon][0]}</span>`)
                .join('');
            const allergens = icons.filter(icon => !DIET_BADGES[icon]).map(icon => icon.toLowerCase());

            return `<li class="menu-items-list-item">
                <div class="dish-line">${dots}<span class="dish-name">${escapeHtml(item.name)}</span>${badges ? `<span class="dish-tags">${badges}</span>` : ''}</div>
                ${allergens.length ? `<div class="dish-allergens">Contains ${escapeHtml(allergens.join(', '))}</div>` : ''}
            </li>`;
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const results = data.results || {};

            if (!results || Object.keys(results).length === 0) {
                resultsDiv.innerHTML = `<div class="no-results">No dishes match these filters.</div>`;
                return;
            }

            // Day and meal order for chronological sorting
            const DAY_ORDER = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            const MEAL_ORDER = ['breakfast', 'lunch', 'munch', 'dinner'];

            // Get selected day filter (if any)
            const selectedDay = data.filters && data.filters.day ? data.filters.day.toLowerCase() : null;

            // Collect all items from all serveries with their servery info
            const allItems = [];
            for (const [serveryName, serveryData] of Object.entries(results)) {
                if (!serveryData || !serveryData.items || !Array.isArray(serveryData.items)) {
                    continue;
                }
                serveryData.items.forEach(item => {
                    if (item && item.day && item.meal) {
                        const mealType = item.meal.toLowerCase();

                        // If this is a lunch item from a servery that has munch, also add it as a munch item
                        // (since munch uses the same menu as lunch, per user's note)
                        if (mealType === 'lunch' && serveryHasMunch(serveryName, item.day)) {
                            // Add as munch item (separate time slot)
                            allItems.push({
                                name: item.name,
                                icons: item.icons || [],
                                matchedCuisines: item.matched_cuisines || [],
                                day: item.day,
                                meal: 'munch', // Show in munch time slot
                                servery: serveryName,
                                is_currently_available: item.is_currently_available || false
                            });
                        }

                        // Always add the original item (lunch items go to lunch slot, munch items go to munch slot)
                        allItems.push({
                            name: item.name,
                            icons: item.icons || [],
                            matchedCuisines: item.matched_cuisines || [],
                            day: item.day,
                            meal: item.meal,
                            servery: serveryName,
                            is_currently_available: item.is_currently_available || false
                        });
                    }
                });
            }

            // Smart sorting: current/upcoming first, then future, then past
            const now = new Date();
            const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            const todayName = dayNames[now.getDay()].toLowerCase();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTime = currentHour * 60 + currentMinute; // minutes since midnight

            // Helper to get meal start and end times in minutes
            function getMealTimeRange(mealType) {
                const isWeekend = now.getDay() === 0 || now.getDay() === 6;
                const mealRanges = {
                    'breakfast': { start: 7 * 60 + 30, end: 10 * 60 },  // 7:30 AM - 10:00 AM
                    'lunch': { start: 11 * 60 + 30, end: 14 * 60 },      // 11:30 AM - 2:00 PM
                    'munch': {
                        start: isWeekend ? 15 * 60 : 14 * 60,            // 3:00 PM weekends, 2:00 PM weekdays
                        end: isWeekend ? 17 * 60 : 16 * 60               // 5:00 PM weekends, 4:00 PM weekdays
                    },
                    'dinner': { start: 17 * 60, end: 21 * 60 }          // 5:00 PM - 9:00 PM
                };
                return mealRanges[mealType.toLowerCase()] || { start: 0, end: 0 };
            }

            // Helper to check if a meal time slot has passed
            function hasMealPassed(dayName, mealType) {
                if (dayName.toLowerCase() !== todayName) {
                    // For other days, compare day order
                    const dayIdx = DAY_ORDER.indexOf(dayName.toLowerCase());
                    const todayIdx = DAY_ORDER.indexOf(todayName);
                    return dayIdx < todayIdx;
                }
                // Same day - check if meal time has passed
                const mealTypeLower = mealType.toLowerCase();
                const mealRange = getMealTimeRange(mealType);

                // Special case: lunch ends at 2pm, but if we're in munch time, lunch has passed
                // (even though lunch items might show during munch, the lunch meal period itself has passed)
                if (mealTypeLower === 'lunch') {
                    // Lunch ends at 2pm (14:00), so if it's past 2pm, lunch has passed
                    return currentTime > mealRange.end;
                }

                return currentTime > mealRange.end;
            }

            // Helper to check if a meal is currently happening (generic check, not servery-specific)
            function isMealCurrent(dayName, mealType) {
                if (dayName.toLowerCase() !== todayName) return false;

                const mealTypeLower = mealType.toLowerCase();

                // Special handling for lunch - check if we're in lunch OR munch time
                // (since lunch items can be shown during munch)
                if (mealTypeLower === 'lunch') {
                    const lunchRange = getMealTimeRange('lunch');
                    const munchRange = getMealTimeRange('munch');
                    return (currentTime >= lunchRange.start && currentTime <= lunchRange.end) ||
                           (currentTime >= munchRange.start && currentTime <= munchRange.end);
                }

                // For munch, check munch time range
                if (mealTypeLower === 'munch') {
                    const munchRange = getMealTimeRange('munch');
                    return currentTime >= munchRange.start && currentTime <= munchRange.end;
                }

                // For other meals, check their specific time range
                const mealRange = getMealTimeRange(mealType);
                return currentTime >= mealRange.start && currentTime <= mealRange.end;
            }

            // Helper to check if a servery is currently open for a specific meal
            // Uses actual servery-specific schedule data
            function isServeryOpen(serveryName, dayName, mealType) {
                if (dayName.toLowerCase() !== todayName) return false;

                // Get servery-specific meal time range
                const mealRange = getServeryMealTimeRange(serveryName, dayName, mealType);
                if (!mealRange) return false;

                // Check if current time is within this servery's specific meal time
                return currentTime >= mealRange.start && currentTime <= mealRange.end;
            }

            allItems.sort((a, b) => {
                const dayA = a.day.toLowerCase();
                const dayB = b.day.toLowerCase();
                const mealA = a.meal.toLowerCase();
                const mealB = b.meal.toLowerCase();

                // If specific day is selected, just sort by meal order for that day
                if (selectedDay) {
                    if (dayA !== selectedDay && dayB !== selectedDay) {
                        // Both not selected day - maintain relative order
                        const dayIdxA = DAY_ORDER.indexOf(dayA);
                        const dayIdxB = DAY_ORDER.indexOf(dayB);
                        if (dayIdxA !== dayIdxB) return dayIdxA - dayIdxB;
                    } else if (dayA === selectedDay && dayB !== selectedDay) {
                        return -1; // Selected day comes first
                    } else if (dayA !== selectedDay && dayB === selectedDay) {
                        return 1; // Selected day comes first
                    } else {
                        // Both selected day - sort by meal
                        const mealIdxA = MEAL_ORDER.indexOf(mealA);
                        const mealIdxB = MEAL_ORDER.indexOf(mealB);
                        return mealIdxA - mealIdxB;
                    }
                }

                // No day filter - smart sorting: current/upcoming first
                const currentA = isMealCurrent(dayA, mealA);
                const currentB = isMealCurrent(dayB, mealB);
                const passedA = hasMealPassed(dayA, mealA);
                const passedB = hasMealPassed(dayB, mealB);

                // Past meals ALWAYS go to the end (lowest priority)
                if (passedA && !passedB) return 1;  // A is past, B is not - A goes after B
                if (!passedA && passedB) return -1; // B is past, A is not - B goes after A (A comes first)

                // Currently happening meals come first (after we've filtered out past meals)
                if (currentA && !currentB) return -1;
                if (!currentA && currentB) return 1;

                // If both are current, prioritize munch over lunch (munch is more specific)
                if (currentA && currentB) {
                    if (mealA === 'munch' && mealB === 'lunch') return -1;
                    if (mealA === 'lunch' && mealB === 'munch') return 1;
                    // If both same type or neither is munch/lunch, sort by meal order
                    const mealIdxA = MEAL_ORDER.indexOf(mealA);
                    const mealIdxB = MEAL_ORDER.indexOf(mealB);
                    return mealIdxA - mealIdxB;
                }

                // If both are upcoming (not current, not passed), sort chronologically
                // If both are past, sort chronologically
                const dayIdxA = DAY_ORDER.indexOf(dayA);
                const dayIdxB = DAY_ORDER.indexOf(dayB);
                if (dayIdxA !== dayIdxB) {
                    // Different days - chronological order
                    return dayIdxA - dayIdxB;
                }

                // Same day - sort by meal
                const mealIdxA = MEAL_ORDER.indexOf(mealA);
                const mealIdxB = MEAL_ORDER.indexOf(mealB);
                return mealIdxA - mealIdxB;
            });

            // Group the sorted items into time slots (day + meal), then by servery
            const slots = [];
            allItems.forEach(item => {
                const key = `${item.day}|${item.meal}`;
                let slot = slots[slots.length - 1];
                if (!slot || slot.key !== key) {
                    slot = { key, day: item.day, meal: item.meal, serveries: {} };
                    slots.push(slot);
                }
                (slot.serveries[item.servery] = slot.serveries[item.servery] || []).push(item);
            });

            // Name the active filters next to the count, so a leftover filter is never a surprise
            const f = currentFilterPayload();
            const split = value => value ? value.split(',') : [];
            const activeFilters = [
                ...split(f.cuisine),
                ...split(f.servery).map(s => SERVERY_NAMES[s] || titleCase(s)),
                f.day && titleCase(f.day),
                f.meal && titleCase(f.meal),
                f.item && `“${f.item}”`,
                ...split(f.dietary).map(titleCase),
                ...split(f.dietary_exclude).map(d => `No ${d}`),
            ].filter(Boolean);

            const dishCount = allItems.length;
            let html = `<div class="results-summary">${dishCount} ${dishCount === 1 ? 'dish' : 'dishes'} across ${slots.length} ${slots.length === 1 ? 'meal' : 'meals'}${activeFilters.map(name => ` · ${escapeHtml(name)}`).join('')}</div>`;

            slots.forEach(slot => {
                const mealHasPassed = hasMealPassed(slot.day.toLowerCase(), slot.meal.toLowerCase());
                html += `<section class="item-group ${mealHasPassed ? 'past-meal-group' : ''}">
                    <h2 class="item-group-title ${mealHasPassed ? 'past-meal' : ''}">
                        <span>${titleCase(slot.day)} · ${titleCase(slot.meal)}</span>
                        ${mealHasPassed ? '<span class="past-meal-badge">Past</span>' : ''}
                    </h2>`;

                for (const [serveryName, serveryItems] of Object.entries(slot.serveries)) {
                    const isOpen = isServeryOpen(serveryName, slot.day, slot.meal);
                    const name = SERVERY_NAMES[serveryName.toLowerCase()] || titleCase(serveryName);
                    html += `<div class="menu-item">
                        <div class="servery-name">${escapeHtml(name)}${isOpen ? '<span class="open-pill">Open now</span>' : ''}</div>
                        <ul class="menu-items-list">${serveryItems.map(renderDish).join('')}</ul>
                    </div>`;
                }

                html += `</section>`;
            });

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
